version: '3.8'

services:
  teman_tanyamu_app:
    build: .
    container_name: teman_tanyamu_prod
    restart: always
    # Secrets (SESSION_SECRET, ROUTER_KEY, ...) come from production.env — never hardcoded here.
    # Copy production.env.example to production.env and fill in your own values.
    env_file:
      - production.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persistent SQLite database mount to preserve all your chat histories and settings on restart
      - ./chat.db:/app/chat.db
    ports:
      # Maps host port 3001 to container port 3000 to enable side-by-side coexistence with dev (port 3000)
      - "3001:3000"
